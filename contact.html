<script src="i18n.js"></script>
<script>
  const WHATSAPP_URL = "https://wa.me/201284622564";

  function applyPageLang() {
    applyDocumentLang();
    const lang = getLang();
    document.getElementById("pageAr").style.display = lang === "ar" ? "" : "none";
    document.getElementById("pageEn").style.display = lang === "en" ? "" : "none";
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.dataset.i18n;
      if (t()[key] !== undefined) el.textContent = t()[key];
    });
    const langBtn = document.getElementById("langToggleBtn");
    if (langBtn) langBtn.textContent = t().langToggle;
  }

  function handleSubmit(e, lang) {
    e.preventDefault();
    const form = e.target;
    const name = form.name.value.trim();
    const phone = form.phone.value.trim();
    const message = form.message.value.trim();

    const text = lang === "ar"
      ? `مرحبًا، اسمي ${name} (${phone}).\n${message || "عايزة أستفسر عن المتجر."}`
      : `Hello, my name is ${name} (${phone}).\n${message || "I'd like to ask about the shop."}`;

    window.open(`${WHATSAPP_URL}?text=${encodeURIComponent(text)}`, "_blank", "noopener");
    form.reset();
  }

  document.getElementById("contactFormAr").addEventListener("submit", (e) => handleSubmit(e, "ar"));
  document.getElementById("contactFormEn").addEventListener("submit", (e) => handleSubmit(e, "en"));

  document.getElementById("langToggleBtn").addEventListener("click", () => {
    setLang(getLang() === "ar" ? "en" : "ar");
    applyPageLang();
  });
  applyPageLang();
</script>
